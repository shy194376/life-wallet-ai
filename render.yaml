services:
  - type: web
    name: life-wallet-ai
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt -r requirements-deploy.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: DEEPSEEK_KEEPALIVE_ENABLED
        value: "true"
      - key: DEEPSEEK_HEARTBEAT_SECONDS
        value: "30"
      - key: DEEPSEEK_RECONNECT_SECONDS
        value: "5"
      - key: ALLOW_LOCAL_FALLBACK
        value: "false"
